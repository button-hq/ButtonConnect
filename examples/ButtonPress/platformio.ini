; Build config for the ButtonPress example.
;
; ESP8266 NEEDS the MMU flag below. The Button cloud is reached over TLS behind
; Cloudflare, Cloudflare does not negotiate MFLN, and BearSSL therefore
; allocates a full 16 KB receive buffer — which will not fit in the ~40 KB heap
; alongside WiFi and the MQTT buffers. The flag moves a second heap into IRAM.
; Without it the WebSocket connects and the TLS handshake then fails, or the board
; reboots on connect. ESP32 has room to spare and needs nothing.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@^2.4.1
  hideakitai/MQTTPubSubClient@^0.3.2
  bblanchon/ArduinoJson@^6.21.0

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
lib_deps =
  links2004/WebSockets@^2.4.1
  hideakitai/MQTTPubSubClient@^0.3.2
  bblanchon/ArduinoJson@^6.21.0
