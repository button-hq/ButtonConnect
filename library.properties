sentence=Connect your own ESP32/ESP8266 to the Button cloud — WiFi + MQTT over a TLS WebSocket.
paragraph=Connect your own ESP32/ESP8266 hardware to Button (buttonhq.io). WiFi + MQTT over a TLS WebSocket, server certificate validated against two bundled public root CAs: publish button gestures and telemetry, receive commands (reboot, actuation) and press acknowledgements. No FOTA or provisioning — you supply the credentials from the dashboard.
