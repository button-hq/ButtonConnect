sentence=BYOD device SDK for the Button cloud — WiFi + MQTT-over-WSS on the byod/ plane.
paragraph=Connect your own ESP32/ESP8266 hardware to Button (buttonhq.io). WiFi + MQTT over secure WebSockets (through the Cloudflare edge) with mandatory TLS server validation: publish button gestures and telemetry, receive commands (reboot, actuation) and press acknowledgements. No FOTA or provisioning — you supply the credentials from the dashboard.
